<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="referrer" content="no-referrer"><title>Coca-Cola SMS</title><link rel="icon" href="./assets/coca-cola.svg"><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.js"></script></head>
<body><div class="app-shell">
<header class="topbar"><span id="connection" class="connection" aria-label="Подключение"><i></i><span class="sr-only">Не подключено</span></span><strong id="balance" aria-label="Баланс">$ —</strong><div class="top-actions"><button id="refresh" class="icon-button" title="Обновить" aria-label="Обновить баланс и заказы" data-icon="refresh"></button><button id="settings" class="icon-button" title="Настройки" aria-label="Настройки подключения" data-icon="settings"></button></div></header>
<main><section class="stage" aria-label="Покупка номера и получение SMS"><div id="circle" class="circle"><button id="buy" class="circle-buy" aria-label="Купить номер Coca-Cola"><img class="coca-logo" src="./assets/coca-cola.svg" alt="Coca-Cola"><span id="buy-label" class="sr-only"></span></button><div id="current-order" class="circle-order" hidden><button id="copy-current-code" class="circle-code" title="Скопировать код" aria-label="Скопировать код" hidden><span id="current-code"></span><span data-icon="copy"></span></button><button id="copy-current-phone" class="circle-phone" title="Скопировать номер" aria-label="Скопировать номер"><span id="current-phone"></span><span data-icon="copy"></span></button><span id="countdown" class="countdown"></span></div></div><button id="new-order" class="new-order icon-button" aria-label="Купить ещё номер" title="Купить ещё номер" data-icon="plus" hidden></button></section>
<section class="history" aria-label="История номеров"><div class="table-toolbar"><input id="search" aria-label="Поиск номера или кода" placeholder="Поиск" type="search"><span id="demo-indicator" hidden>DEMO</span></div><div id="table-viewport" class="table-viewport"><table><thead><tr><th>ID</th><th>Phone number</th><th>Code</th><th>Статус</th><th>Цена</th><th></th></tr></thead><tbody id="history-body"></tbody></table><div id="history-empty" class="history-empty">—</div></div><div class="history-footer"><span id="rows-info"></span><div class="pagination"><button id="prev" class="icon-button" aria-label="Предыдущая страница" data-icon="chevron-left" disabled></button><span id="page-info">1 / 1</span><button id="next" class="icon-button" aria-label="Следующая страница" data-icon="chevron" disabled></button></div></div></section></main></div>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-heading"><div><h2>Настройки</h2></div><button type="button" id="close-settings" class="icon-button" aria-label="Закрыть настройки" data-icon="close"></button></div><label class="field">API-ключ<input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="Вставьте ключ SMSPool" required></label><label class="field">Адрес API-прокси<input id="proxy-url" type="url" placeholder="https://your-worker.workers.dev" spellcheck="false"></label><div class="settings-grid"><label class="field">Лимит цены, USD<input id="max-price" type="number" min="0.01" step="0.01" placeholder="Без лимита"></label><label class="checkbox-field"><input id="sound" type="checkbox" checked><span>Звук при получении SMS</span></label></div><p id="settings-error" class="form-error" role="alert"></p><div class="utility-actions"><button type="button" id="demo" class="quiet-button">Демо</button><button type="button" id="export" class="icon-button" title="CSV" aria-label="Скачать историю CSV" data-icon="download"></button></div><div class="dialog-actions"><button type="button" id="disconnect" class="quiet-button">Отключить</button><button id="connect" class="primary-button" type="submit">Подключить <span data-icon="arrow"></span></button></div></form></dialog><div id="toast" role="status" aria-live="polite" class="toast" hidden></div></body></html>
