<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="referrer" content="no-referrer"><title>קוקה-קולה · מסרונים</title><link rel="icon" href="./assets/coca-cola.svg"><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.js"></script></head>
<body><div class="app-shell">
<header class="topbar"><span id="connection" class="connection" aria-label="חיבור"><span class="sr-only">מנותק</span></span><div class="account-metrics"><div class="account-stat"><span data-icon="wallet" title="יתרה" aria-label="יתרה"></span><strong id="balance" aria-label="יתרה">$ —</strong></div><div class="account-stat"><span data-icon="can" title="מספר פחיות משוער לרכישה" aria-label="מספר פחיות משוער לרכישה"></span><strong id="affordable-count" title="הערכה לפי המחיר הממוצע למספר עם קוד שהתקבל">—</strong></div><div class="account-stat"><span data-icon="average" title="מחיר ממוצע למספר" aria-label="מחיר ממוצע למספר"></span><strong id="average-price" title="המחיר הממוצע למספר עם קוד; בהיעדר היסטוריה מוצג המחיר הנוכחי">$ —</strong></div></div><div class="top-actions"><button id="refresh" class="icon-button" title="רענון" aria-label="רענון יתרה והזמנות" data-icon="refresh"></button><button id="settings" class="icon-button" title="הגדרות" aria-label="הגדרות חיבור" data-icon="settings"></button></div></header>
<main><section class="stage" aria-label="רכישת מספר וקבלת מסרון"><div id="circle" class="circle"><button id="buy" class="circle-buy" aria-label="רכישת מספר לקוקה-קולה"><img class="coca-logo" src="./assets/coca-cola.svg" alt="קוקה-קולה"><span id="buy-label" class="sr-only"></span></button><div id="current-order" class="circle-order" hidden><button id="copy-current-code" class="circle-code" title="העתקת קוד" aria-label="העתקת קוד" hidden><span id="current-code"></span><span data-icon="copy"></span></button><button id="copy-current-phone" class="circle-phone" title="העתקת מספר טלפון" aria-label="העתקת מספר טלפון"><span id="current-phone"></span><span data-icon="copy"></span></button><span id="countdown" class="countdown"></span></div><div class="circle-totals" aria-label="רכישות שהתקבל עבורן קוד"><span title="קודים שהתקבלו" aria-label="קודים שהתקבלו"><span data-icon="can"></span><strong id="confirmed-count">0</strong></span><span title="סך ההוצאה על קודים שהתקבלו" aria-label="סך ההוצאה על קודים שהתקבלו"><span data-icon="spent"></span><strong id="confirmed-cost">$0.00</strong></span></div></div><button id="new-order" class="new-order icon-button" aria-label="רכישת מספר נוסף" title="רכישת מספר נוסף" data-icon="plus" hidden></button></section>
<section class="history" aria-label="היסטוריית הזמנות"><div id="table-viewport" class="table-viewport"><table><thead><tr><th aria-label="מספר סידורי"><span data-icon="hash"></span></th><th aria-label="מספר טלפון"><span data-icon="phone"></span></th><th aria-label="קוד"><span data-icon="key"></span></th><th aria-label="מצב"><span data-icon="completed"></span></th><th aria-label="מחיר"><span data-icon="average"></span></th><th aria-label="החזר כספי"><span data-icon="refund"></span></th></tr></thead><tbody id="history-body"></tbody></table><div id="history-empty" class="history-empty">—</div></div><div class="history-footer"><div class="pagination"><button id="prev" class="icon-button" aria-label="העמוד הקודם" data-icon="chevron" disabled></button><span id="page-info">1 / 1</span><button id="next" class="icon-button" aria-label="העמוד הבא" data-icon="chevron-left" disabled></button></div></div></section></main></div>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-heading"><div><h2>הגדרות</h2></div><button type="button" id="close-settings" class="icon-button" aria-label="סגירת הגדרות" data-icon="close"></button></div><label class="field">מפתח API<input id="api-key" dir="ltr" type="password" autocomplete="off" spellcheck="false" placeholder="מפתח ה-API של SMSPool" required></label><label class="field">כתובת שרת התיווך<input id="proxy-url" dir="ltr" type="url" placeholder="https://your-worker.workers.dev" spellcheck="false"></label><div class="settings-grid"><label class="field">מחיר מרבי בדולר<input id="max-price" dir="ltr" type="number" min="0.01" step="0.01" placeholder="ללא הגבלה"></label><label class="checkbox-field"><input id="sound" type="checkbox" checked><span>צליל בקבלת מסרון</span></label></div><p id="settings-error" class="form-error" role="alert"></p><div class="utility-actions"><button type="button" id="demo" class="quiet-button">הדגמה</button><span id="demo-indicator" hidden>הדגמה</span><button type="button" id="export" class="icon-button" title="CSV" aria-label="ייצוא ההיסטוריה לקובץ CSV" data-icon="download"></button></div><div class="dialog-actions"><button type="button" id="disconnect" class="quiet-button">ניתוק</button><button id="connect" class="primary-button" type="submit">חיבור <span data-icon="arrow"></span></button></div></form></dialog><div id="toast" role="status" aria-live="polite" class="toast" hidden></div></body></html>
