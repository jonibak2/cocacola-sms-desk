<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="referrer" content="no-referrer"><title>Coca-Cola SMS</title><link rel="icon" href="./assets/coca-cola.svg"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Coca-Cola"><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.js"></script></head>
<body><div class="app-shell">
<header class="topbar"><span id="connection" class="connection" aria-label="Connection"><span class="sr-only">Disconnected</span></span><div class="account-metrics"><div class="account-stat"><span data-icon="wallet" title="Balance" aria-label="Balance"></span><strong id="balance" aria-label="Balance">$ —</strong></div><div class="account-stat"><span data-icon="can" title="Estimated cans you can buy" aria-label="Estimated cans you can buy"></span><strong id="affordable-count" title="Estimate based on average confirmed number price">—</strong></div><div class="account-stat"><span data-icon="average" title="Average number price" aria-label="Average number price"></span><strong id="average-price" title="Average confirmed number price; current price when no confirmed history">$ —</strong></div></div><div class="top-actions"><button id="refresh" class="icon-button" title="Refresh" aria-label="Refresh balance and orders" data-icon="refresh"></button><button id="settings" class="icon-button" title="Settings" aria-label="Connection settings" data-icon="settings"></button></div></header>
<main><section class="stage" aria-label="Buy a number and receive SMS"><div id="circle" class="circle"><button id="buy" class="circle-buy" aria-label="Buy a Coca-Cola number"><img class="coca-logo" src="./assets/coca-cola.svg" alt="Coca-Cola"><span id="buy-label" class="sr-only"></span></button><div id="current-order" class="circle-order" hidden><button id="copy-current-code" class="circle-code" title="Copy code" aria-label="Copy code" hidden><span id="current-code"></span><span data-icon="copy"></span></button><button id="copy-current-phone" class="circle-phone" title="Copy phone number" aria-label="Copy phone number"><span id="current-phone"></span><span data-icon="copy"></span></button><span id="countdown" class="countdown"></span></div><div class="circle-totals" aria-label="Confirmed purchases"><span title="Confirmed codes" aria-label="Confirmed codes"><span data-icon="can"></span><strong id="confirmed-count">0</strong></span><span title="Total spent on confirmed codes" aria-label="Total spent on confirmed codes"><span data-icon="spent"></span><strong id="confirmed-cost">$0.00</strong></span></div></div><button id="new-order" class="new-order icon-button" aria-label="Buy another number" title="Buy another number" data-icon="plus" hidden></button></section>
<section class="history" aria-label="Order history"><div id="table-viewport" class="table-viewport"><table><thead><tr><th aria-label="ID"><span data-icon="hash"></span></th><th aria-label="Phone number"><span data-icon="phone"></span></th><th aria-label="Code"><span data-icon="key"></span></th><th aria-label="Status"><span data-icon="completed"></span></th><th aria-label="Price"><span data-icon="average"></span></th><th aria-label="Refund"><span data-icon="refund"></span></th></tr></thead><tbody id="history-body"></tbody></table><div id="history-empty" class="history-empty">—</div></div><div class="history-footer"><div class="pagination"><button id="prev" class="icon-button" aria-label="Previous page" data-icon="chevron-left" disabled></button><span id="page-info">1 / 1</span><button id="next" class="icon-button" aria-label="Next page" data-icon="chevron" disabled></button></div></div></section></main></div>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-heading"><div><h2>Settings</h2></div><button type="button" id="close-settings" class="icon-button" aria-label="Close settings" data-icon="close"></button></div><label class="field">API key<input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="Enter your SMSPool API key" required></label><label class="field">API proxy URL<input id="proxy-url" type="url" placeholder="https://your-worker.workers.dev" spellcheck="false"></label><div class="settings-grid"><label class="field">Price limit, USD<input id="max-price" type="number" min="0.01" step="0.01" placeholder="No limit"></label><label class="checkbox-field"><input id="sound" type="checkbox" checked><span>Sound on SMS receipt</span></label></div><p id="settings-error" class="form-error" role="alert"></p><div class="utility-actions"><button type="button" id="demo" class="quiet-button">Demo</button><span id="demo-indicator" hidden>DEMO</span><button type="button" id="export" class="icon-button" title="CSV" aria-label="Export history as CSV" data-icon="download"></button></div><div class="dialog-actions"><button type="button" id="disconnect" class="quiet-button">Disconnect</button><button id="connect" class="primary-button" type="submit">Connect <span data-icon="arrow"></span></button></div></form></dialog><div id="toast" role="status" aria-live="polite" class="toast" hidden></div></body></html>
